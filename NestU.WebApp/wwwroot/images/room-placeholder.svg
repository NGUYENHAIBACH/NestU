<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A3D"/>
      <stop offset="100%" stop-color="#FF8E53"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Subtle grid / pattern -->
  <g opacity="0.04" stroke="#0f172a" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="600" fill="url(#grid)"/>
  </g>

  <!-- Central Card Illustration -->
  <g transform="translate(250, 140)">
    <!-- Room frame -->
    <rect x="0" y="0" width="300" height="220" rx="16" fill="#ffffff" filter="url(#shadow)"/>
    
    <!-- Window illustration -->
    <rect x="30" y="30" width="70" height="70" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <line x1="65" y1="30" x2="65" y2="100" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="30" y1="65" x2="100" y2="65" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Sun outside window -->
    <circle cx="50" cy="50" r="10" fill="#fde047" opacity="0.7"/>

    <!-- Lamp / Picture frame -->
    <rect x="200" y="40" width="60" height="40" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M210 70 L225 55 L235 65 L245 50 L255 70 Z" fill="#cbd5e1"/>

    <!-- Bed illustration -->
    <!-- Headboard -->
    <rect x="110" y="100" width="160" height="60" rx="6" fill="#94a3b8"/>
    <!-- Pillow -->
    <rect x="120" y="115" width="45" height="25" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="175" y="115" width="45" height="25" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Mattress & Blanket -->
    <rect x="110" y="130" width="165" height="50" rx="4" fill="#e2e8f0"/>
    <rect x="150" y="130" width="125" height="50" rx="4" fill="url(#primaryGrad)"/>
    <!-- Bed legs -->
    <rect x="115" y="180" width="8" height="15" rx="2" fill="#64748b"/>
    <rect x="260" y="180" width="8" height="15" rx="2" fill="#64748b"/>

    <!-- Small plant -->
    <path d="M50 170 Q40 145 55 140 Q60 155 50 170" fill="#22c55e"/>
    <path d="M50 170 Q65 148 70 155 Q60 168 50 170" fill="#16a34a"/>
    <path d="M42 170 L58 170 L55 190 L45 190 Z" fill="#b45309"/>

    <!-- Floor line -->
    <line x1="20" y1="195" x2="280" y2="195" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand & Status Text -->
  <text x="400" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">
    NestU
  </text>
  <text x="400" y="450" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748b">
    Hình ảnh phòng đang được cập nhật
  </text>
</svg>

